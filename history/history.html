<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="history.title">Watcharr Scrobbler – History</title>
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="../icons/icon-48.png" alt="Logo" />
        <div>
          <h1 data-i18n="history.pageTitle">Netflix history</h1>
          <p class="sub" data-i18n="history.pageSubtitle">
            Netflix ↔ Watcharr comparison
          </p>
        </div>
      </div>
      <div class="actions">
        <button id="orderBtn" class="ghost" type="button">Newest first</button>
        <button id="reloadBtn" class="ghost" data-i18n="history.reload">
          Reload
        </button>
      </div>
    </header>

    <section id="statusBar" class="status hidden"></section>

    <section class="toolbar">
      <button id="selectAllBtn" class="ghost" data-i18n="history.selectAll">
        Select all
      </button>
      <button id="selectNoneBtn" class="ghost" data-i18n="history.selectNone">
        Select none
      </button>
      <span class="spacer"></span>
      <input
        id="filterBox"
        type="search"
        data-i18n-placeholder="history.filterPlaceholder"
        placeholder="Filter …"
        autocomplete="off"
      />
      <button
        id="importBtn"
        class="primary"
        disabled
        data-i18n="history.importSelected"
      >
        Import selected (0)
      </button>
    </section>

    <section id="list" class="list">
      <div class="list-hint" data-i18n="history.loadingHistory">
        History is loading …
      </div>
    </section>

    <!-- Confirmation before switching the display order to "oldest first". -->
    <div id="confirmModal" class="modal-overlay hidden">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="orderConfirmTitle"
      >
        <h2 id="orderConfirmTitle" data-i18n="history.orderConfirmTitle">
          Switch to oldest first?
        </h2>
        <p class="modal-text" data-i18n="history.orderConfirmText">
          To list the oldest entries at the top, the complete Netflix history is
          loaded once and sorted oldest → newest.
        </p>
        <div class="modal-actions">
          <button id="orderCancelBtn" class="ghost" data-i18n="history.cancel">
            Cancel
          </button>
          <button
            id="orderOkBtn"
            class="primary"
            data-i18n="history.switchToOldest"
          >
            Switch to oldest first
          </button>
        </div>
      </div>
    </div>

    <script src="../i18n/locale.js"></script>
    <script src="../i18n/formatters.js"></script>
    <script src="../i18n/index.js"></script>
    <script src="history.js"></script>
  </body>
</html>
